# Ön yüzü nginx ile sunar. Veritabanı, kimlik doğrulama ve API Supabase'tedir.
# Tamamen lokal çalışmak için: npx supabase start (Docker kullanır), ardından
# .env içindeki adresleri `npx supabase status` çıktısındaki değerlerle değiştirin.
services:
  web:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?.env dosyasında VITE_SUPABASE_URL tanımlayın}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?.env dosyasında VITE_SUPABASE_PUBLISHABLE_KEY tanımlayın}
    restart: unless-stopped
    ports:
      - "8080:80"
